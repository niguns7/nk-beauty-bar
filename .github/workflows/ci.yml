name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nk
          POSTGRES_PASSWORD: nk
          POSTGRES_DB: nk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nk:nk@localhost:5432/nk_test
      ADMIN_TOKEN: ci-admin-token
      CRON_SECRET: ci-cron-secret
      SALON_TZ: America/Chicago
      VAGARO_BASE_URL: http://localhost:0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy   # against the throwaway CI database only
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level high
      - name: Semgrep
        run: pipx run semgrep --config p/owasp-top-ten --config p/typescript --error --quiet src
